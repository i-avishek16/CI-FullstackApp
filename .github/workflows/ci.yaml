name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # Backend steps
      - name: Install backend dependencies
        run: npm install
        working-directory: lesson-3-exercise/CI-FullstackApp/backend

      - name: Run backend tests
        run: npm test || echo "No backend tests defined"
        working-directory: lesson-3-exercise/CI-FullstackApp/backend

      # Frontend steps
      - name: Install frontend dependencies
        run: npm install
        working-directory: lesson-3-exercise/CI-FullstackApp/frontend

      - name: Build frontend
        run: npm run build || echo "No frontend build script defined"
        working-directory: lesson-3-exercise/CI-FullstackApp/frontend
